name: Deploy to gh page

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127

      - name: Generate Checkpoint Models
        run: |
          mkdir -p models
          cargo run --release --bin train -- --x 6.2831853 --y 6.2831853 --num-x 32 --num-y 32 --viscosity 0.005 --num-data 10 --num-epochs 0 --output-dir models
          mv models/fno_weights.bin models/checkpoint_epoch_0.bin
          cargo run --release --bin train -- --x 6.2831853 --y 6.2831853 --num-x 32 --num-y 32 --viscosity 0.005 --num-data 10 --num-epochs 5 --output-dir models
          mv models/fno_weights.bin models/checkpoint_epoch_5.bin
          cargo run --release --bin train -- --x 6.2831853 --y 6.2831853 --num-x 32 --num-y 32 --viscosity 0.005 --num-data 10 --num-epochs 25 --output-dir models
          mv models/fno_weights.bin models/checkpoint_epoch_25.bin

      - name: Build WebAssembly Package
        run: |
          cargo build --target wasm32-unknown-unknown --release --lib
          wasm-bindgen --target web --out-dir frontend/pkg target/wasm32-unknown-unknown/release/fluidsim.wasm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
